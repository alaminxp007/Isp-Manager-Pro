          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPayments"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /signups:
    get:
      operationId: listSignups
      tags: [signups]
      summary: List signup applications
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, done]
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of signups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupList"
    post:
      operationId: createSignup
      tags: [signups]
      summary: Create a new signup application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Signup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signup"

  /signups/{id}:
    patch:
      operationId: updateSignup
      tags: [signups]
      summary: Update signup status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupStatusUpdate"
      responses:
        "200":
          description: Signup updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signup"
    delete:
      operationId: deleteSignup
      tags: [signups]
      summary: Delete a signup application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signup deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

